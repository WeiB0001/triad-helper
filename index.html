<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>九宮幻卡 · 對局輔助盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Oswald:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1017; --p1:#121b26; --p2:#18232f; --p3:#22303f; --line:#2b3a4c;
  --ink:#e9eef5; --dim:#8ea0b6; --dim2:#63758c;
  --gold:#d9b45a; --gold-d:#8a6f2a;
  --blue:#3d8ef0; --blue-bg:#12335c; --blue-ln:#2f6fc4;
  --red:#e4614a; --red-bg:#4a1c15; --red-ln:#b04030;
  --ok:#57b06e;
  --r:8px; --rs:5px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.6;padding-bottom:40px}
h1,h2,h3,.disp{font-family:Cinzel,"Noto Sans TC",serif;letter-spacing:.03em;margin:0}
.num{font-family:Oswald,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2b3a4c;border-radius:4px}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(11,16,23,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px}
.logo .mk{width:24px;height:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px}
.logo .mk i{background:#243141;border-radius:1px}
.logo .mk i:nth-child(5){background:var(--gold)}
.logo b{font-family:Cinzel,serif;font-size:15px;font-weight:600}
.tabs{margin-left:auto;display:flex;gap:2px;overflow-x:auto}
.tabs button{padding:7px 13px;border-radius:999px;color:var(--dim);font-weight:500;white-space:nowrap}
.tabs button.on{background:var(--p3);color:var(--gold)}
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px}
.panel{display:none}.panel.on{display:block}

/* blocks */
.blk{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.blk>h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim)}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{background:var(--p3);border:1px solid var(--line);border-radius:var(--rs);padding:9px 15px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.go{background:linear-gradient(180deg,#6b5620,#3f3213);border-color:var(--gold);color:#ffe9ae;font-size:15px;padding:12px 22px}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.on{background:var(--gold);color:#20180a;border-color:var(--gold)}
.dim{color:var(--dim)}.hint{font-size:12px;color:var(--dim2);margin:6px 0 0}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--dim)}
.tag.g{border-color:var(--gold-d);color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:7px 16px;color:var(--dim);font-size:13px}
.seg button.on{background:var(--p3);color:var(--gold)}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}

/* card face */
.tt{position:relative;width:82px;height:104px;border-radius:var(--rs);flex:0 0 auto;user-select:none;
  background:linear-gradient(165deg,#2a3849,#18222e);border:1px solid #33445a}
.tt.mine{background:linear-gradient(165deg,#1e4c85,var(--blue-bg));border-color:var(--blue-ln);box-shadow:0 0 0 1px rgba(61,142,240,.25)}
.tt.opp{background:linear-gradient(165deg,#7a2c20,var(--red-bg));border-color:var(--red-ln);box-shadow:0 0 0 1px rgba(228,97,74,.25)}
.tt .v{position:absolute;font-family:Oswald,sans-serif;font-size:15px;font-weight:600;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.tt .v.u{top:7px;left:50%;transform:translateX(-50%)}
.tt .v.d{bottom:22px;left:50%;transform:translateX(-50%)}
.tt .v.l{left:9px;top:42%}
.tt .v.r{right:9px;top:42%}
.tt .v.up{color:#9de8b0}.tt .v.dn{color:#ffb3a3}
.tt .nm{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9.5px;line-height:1.15;padding:0 3px;color:#b7c5d6;max-height:2.3em;overflow:hidden}
.tt .ty{position:absolute;top:5px;left:6px;font-size:8.5px;color:var(--gold)}
.tt .st{position:absolute;top:5px;right:6px;font-size:8.5px;color:var(--gold)}
.tt.tap{cursor:pointer;transition:transform .1s}
.tt.tap:hover{transform:translateY(-3px);border-color:var(--gold)}
.tt.sel{outline:2px solid var(--gold);outline-offset:2px;transform:translateY(-4px)}
.tt.add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;border:1px dashed #3a4b60;background:#101823;color:var(--dim2);font-size:11px;cursor:pointer}
.tt.add:hover{border-color:var(--gold);color:var(--gold)}
.tt.s{width:62px;height:79px}
.tt.s .v{font-size:12px}.tt.s .v.d{bottom:17px}.tt.s .nm{font-size:8px}
.tt.s .ty,.tt.s .st{font-size:7.5px}
.rail{display:flex;gap:6px;flex-wrap:wrap;min-height:80px;align-items:flex-start}
.rail.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}

/* board */
.stage{display:grid;grid-template-columns:minmax(0,auto) minmax(240px,1fr);gap:18px;align-items:start}
@media(max-width:800px){.stage{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(3,92px);grid-auto-rows:116px;gap:6px;padding:8px;
  background:radial-gradient(120% 120% at 50% 0%,#16202c,#0a0f15);border:1px solid var(--line);border-radius:var(--r)}
.cell{position:relative;border-radius:var(--rs);display:flex;align-items:center;justify-content:center}
.cell .tt{width:92px;height:116px}
.cell.free{border:1px dashed #2b3a4c;background:#0d141c}
.cell.free.arm{cursor:pointer;border-color:var(--gold);background:#141d27}
.cell.free.arm:hover{background:#1a2530}
.cell .n{font-family:Oswald;font-size:24px;color:#1d2836}
.cell .badge{position:absolute;top:4px;left:4px;background:var(--ok);color:#08170c;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;font-family:Oswald}
.cell.hint1{border-color:var(--ok);box-shadow:inset 0 0 22px rgba(87,176,110,.35)}
.cell.hint2{border-color:rgba(87,176,110,.5)}
.cell.hint3{border-color:rgba(87,176,110,.28)}
.cell.justplaced .tt{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.86);opacity:.4}to{transform:scale(1);opacity:1}}

.score{display:flex;align-items:center;gap:8px;font-family:Oswald;font-size:24px;margin-left:auto}
.score .a{color:var(--blue)}.score .b{color:var(--red)}
.bar10{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--red);margin-top:6px}
.bar10 i{background:var(--blue)}
.status{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--rs);padding:10px 12px;background:var(--p2);margin:10px 0}
.status.me{border-left-color:var(--blue)}.status.op{border-left-color:var(--red)}
.status b{font-size:14px}
.status .sub{font-size:12px;color:var(--dim);margin-top:2px}
.advs{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.advs li{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:var(--rs);padding:7px 10px;background:var(--p2);font-size:13px;cursor:pointer}
.advs li:hover{border-color:var(--gold)}
.advs li .k{font-family:Oswald;color:var(--gold);width:16px}
.advs li .e{margin-left:auto;font-family:Oswald;font-size:15px}

/* deck cards */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dk{border:1px solid var(--line);border-radius:var(--r);padding:11px;background:var(--p2)}
.dk.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-d)}
.dk h4{margin:0 0 8px;font-size:13px;display:flex;gap:8px;align-items:center}
.dk h4 input{flex:1;min-width:0;padding:5px 8px}
.mini{width:40px;height:52px;border-radius:3px;position:relative;background:#111a24;border:1px solid #2a3746}
.mini.f{background:linear-gradient(165deg,#1e4c85,#12335c);border-color:var(--blue-ln)}
.mini span{position:absolute;font-family:Oswald;font-size:9px}
.mini .u{top:2px;left:50%;transform:translateX(-50%)}.mini .d{bottom:2px;left:50%;transform:translateX(-50%)}
.mini .l{left:3px;top:20px}.mini .r{right:3px;top:20px}

/* npc list */
.nplist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--p2)}
.nprow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #1e2937;cursor:pointer}
.nprow:last-child{border-bottom:none}
.nprow:hover{background:var(--p3)}
.nprow.on{background:#243448;box-shadow:inset 3px 0 0 var(--gold)}
.nprow .l1{font-weight:500}.nprow .l2{font-size:11px;color:var(--dim2)}
.nprow .rt{margin-left:auto;display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,7,11,.8);display:none;align-items:center;justify-content:center;z-index:80;padding:12px}
.scrim.on{display:flex}
.modal{background:var(--p1);border:1px solid var(--gold-d);border-radius:var(--r);max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.modal h3{font-size:15px;color:var(--gold);margin-bottom:8px}
.pickgrid{display:flex;flex-wrap:wrap;gap:6px;max-height:38vh;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:var(--rs);background:#0d141c}
.vrow{display:flex;gap:4px;align-items:center;margin:5px 0}
.vrow>b{width:20px;flex:0 0 20px;color:var(--gold);font-size:12px;text-align:center}
.chip{width:32px;height:32px;flex:0 0 auto;border:1px solid var(--line);border-radius:5px;background:#0f1720;font-family:Oswald;font-size:16px;color:var(--ink)}
.vrow .chip{flex:1 1 24px;min-width:24px;width:auto;height:34px}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);color:#20180a;border-color:var(--gold);font-weight:600}
/* 十字填值盤：位置＝卡片上下左右 */
.cross{display:grid;grid-template-areas:". t ." "l m r" ". b .";justify-content:center;
  justify-items:center;align-items:center;gap:10px;margin:4px auto}
.cross .t{grid-area:t}.cross .l{grid-area:l}.cross .m{grid-area:m}.cross .r{grid-area:r}.cross .b{grid-area:b}
.cblk{display:flex;flex-direction:column;align-items:center;gap:4px}
.cblk>span{font-size:11px;color:var(--gold);letter-spacing:.1em}
.cgrid{display:grid;gap:4px}
.cross .t .cgrid,.cross .b .cgrid{grid-template-columns:repeat(5,32px)}
.cross .l .cgrid,.cross .r .cgrid{grid-template-columns:repeat(2,32px)}
.cross .m .tt{width:104px;height:132px}
.cross .m .tt .v{font-size:18px}
@media(max-width:400px){.cross{gap:6px}.chip{width:28px;height:28px;font-size:14px}
  .cross .t .cgrid,.cross .b .cgrid{grid-template-columns:repeat(5,28px)}
  .cross .l .cgrid,.cross .r .cgrid{grid-template-columns:repeat(2,28px)}
  .cross .m .tt{width:88px;height:112px}}
.rank{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--rs);background:var(--p2);padding:8px 11px;cursor:pointer;font-size:13px}
.rank li:hover{border-color:var(--gold)}
.rank li.top{border-color:var(--ok);box-shadow:inset 0 0 18px rgba(87,176,110,.16)}
.rank li .k{font-family:Oswald;color:var(--gold);width:16px}
.rank li .p{margin-left:auto;font-family:Oswald;font-size:16px}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rules label{display:flex;gap:7px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--rs);padding:7px 9px;background:#0f1720;font-size:12px;cursor:pointer}
.rules label.on{border-color:var(--gold);background:#1b1a10}
.rules small{display:block;color:var(--dim2);font-size:10px;line-height:1.3}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p3);border:1px solid var(--gold);padding:9px 18px;border-radius:999px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;font-size:13px}
.toast.on{opacity:1}
@media(max-width:520px){
  .board{grid-template-columns:repeat(3,30vw);grid-auto-rows:38vw}
  .cell .tt{width:30vw;height:38vw}
  .tt{width:74px;height:94px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

].map(a=>({id:a[0],n:a[1],v:[a[2],a[3],a[4],a[5]],t:a[6],s:a[7],src:'base'}));

const NPCS = [

/* ===================== 規則引擎 ===================== */
const OPPS=[1,0,3,2];                       // 上下左右 的對面
const NB=[],WALL=[];
for(let i=0;i<9;i++){const r=(i/3)|0,c=i%3,a=[],w=[];
  if(r>0)a.push([0,i-3]); else w.push(0);
  if(r<2)a.push([1,i+3]); else w.push(1);
  if(c>0)a.push([2,i-1]); else w.push(2);
  if(c<2)a.push([3,i+1]); else w.push(3);
  NB.push(a);WALL.push(w);}

function effAll(b,R){
  const cnt=[0,0,0,0,0];
  for(const x of b) if(x&&x.c.t) cnt[x.c.t]++;
  const asc=R['同類強化'],dsc=R['同類弱化'];
  return b.map(x=>{
    if(!x)return null;
    let d=0;
    if(x.c.t&&(asc||dsc)){const n=Math.max(0,cnt[x.c.t]-1); d=asc?n:-n;}
    return x.c.v.map(v=>Math.max(1,Math.min(10,v+d)));
  });
}
function beats(a,b,R){
  if(R['王牌殺手']){
    if(R['逆轉']){ if(a===10&&b===1)return true; if(a===1&&b===10)return false; }
    else { if(a===1&&b===10)return true; if(a===10&&b===1)return false; }
  }
  return R['逆轉']? a<b : a>b;
}
/* 在 pos 落子後結算翻牌。b 會被就地修改 */
function resolve(b,pos,R){
  const me=b[pos].o, EV=effAll(b,R), mv=EV[pos];
  const flipped=[];
  const grab=j=>{ if(b[j].o!==me){b[j].o=me;flipped.push(j);} };
  /* 同數 / 加算 */
  const sameHit=[]; const sums={};
  for(const [d,j] of NB[pos]){
    if(!b[j])continue;
    const a=mv[d], o=EV[j][OPPS[d]];
    if(a===o) sameHit.push(j);
    (sums[a+o]=sums[a+o]||[]).push(j);
  }
  let wallSame=0;
  if(R['同數壁']) for(const d of WALL[pos]) if(mv[d]===10) wallSame++;
  const special=[];
  if(R['同數']&&(sameHit.length+wallSame)>=2) special.push(...sameHit);
  if(R['加算']) for(const k in sums) if(sums[k].length>=2) special.push(...sums[k]);
  const before=flipped.length;
  for(const j of new Set(special)) grab(j);
  /* 連鎖 */
  if(flipped.length>before&&R['連鎖']!==false){
    const q=flipped.slice(before);
    while(q.length){
      const p=q.shift();
      for(const [d,j] of NB[p]){
        if(!b[j]||b[j].o===me)continue;
        if(beats(EV[p][d],EV[j][OPPS[d]],R)){ b[j].o=me; flipped.push(j); q.push(j); }
      }
    }
  }
  /* 一般比大小 */
  for(const [d,j] of NB[pos]){
    if(!b[j]||b[j].o===me)continue;
    if(beats(mv[d],EV[j][OPPS[d]],R)) grab(j);
  }
  return flipped;
}
function cloneS(s){return{b:s.b.map(x=>x?{c:x.c,o:x.o}:null),h:[s.h[0].slice(),s.h[1].slice()],turn:s.turn,filled:s.filled,R:s.R};}
function play(s,hi,pos){
  const n=cloneS(s), card=n.h[s.turn][hi];
  n.h[s.turn]=n.h[s.turn].filter((_,i)=>i!==hi);
  n.b[pos]={c:card,o:s.turn}; n.filled++;
  resolve(n.b,pos,n.R);
  n.turn=1-s.turn;
  return n;
}
function diffOf(s){let m=s.h[0].length,o=s.h[1].length;for(const x of s.b)if(x)x.o===0?m++:o++;return m-o;}
function heur(s){
  let v=diffOf(s)*1000;
  const EV=effAll(s.b,s.R);
  for(let i=0;i<9;i++){
    if(!s.b[i])continue;
    let exp=0,open=0;
    for(const [d,j] of NB[i]) if(!s.b[j]){exp+=EV[i][d];open++;}
    if(!open)continue;
    const q=(exp/open-5)*6;
    v+= s.b[i].o===0? q : -q;
  }
  return v;
}
/* ---------- 高速搜尋核心（扁平陣列 + make/unmake） ---------- */
let CV,CTY,CSIG,OCC,OWN,TC,HAND,HM;
let SAME,PLUS,SWALL,COMBO,REV,FACE,ASC,DSC,ORDER;
const FLIP=new Int32Array(512); let FTOP=0;
const SH=new Int32Array(4),SUMC=new Int8Array(24),SUMJ=new Int32Array(96),TOUCH=new Int32Array(8),CQ=new Int32Array(16);
let NODES=0,TSTOP=0,TIMEDOUT=false,WINB=false;
const NODECAP=3500000;
function finalF(){const d=diffF();return d*1000+(WINB?(d>0?2500:d<0?-2500:0):0);}
const pc=x=>{let n=0;while(x){n+=x&1;x>>=1;}return n;};
function ev(cell,dir){
  const c=OCC[cell]; let v=CV[c*4+dir]; const t=CTY[c];
  if(t&&(ASC||DSC)){ const n=TC[t]-1; v+= ASC? n : -n; if(v<1)v=1; else if(v>10)v=10; }
  return v;
}
function beatsF(a,b){
  if(FACE){ if(REV){ if(a===10&&b===1)return true; if(a===1&&b===10)return false; }
            else    { if(a===1&&b===10)return true; if(a===10&&b===1)return false; } }
  return REV? a<b : a>b;
}
function resolveF(pos,me){
  const nb=NB[pos]; let shc=0,tc=0;
  for(let k=0;k<nb.length;k++){
    const d=nb[k][0],j=nb[k][1]; if(OCC[j]<0)continue;
    const a=ev(pos,d),o=ev(j,OPPS[d]);
    if(a===o)SH[shc++]=j;
    const s=a+o; if(SUMC[s]===0)TOUCH[tc++]=s; SUMJ[s*4+SUMC[s]++]=j;
  }
  let wall=0;
  if(SWALL){const w=WALL[pos];for(let k=0;k<w.length;k++)if(ev(pos,w[k])===10)wall++;}
  const sp=FTOP;
  if(SAME&&shc+wall>=2) for(let k=0;k<shc;k++){const j=SH[k];if(OWN[j]!==me){OWN[j]=me;FLIP[FTOP++]=j;}}
  if(PLUS) for(let k=0;k<tc;k++){const s=TOUCH[k];
    if(SUMC[s]>=2) for(let m=0;m<SUMC[s];m++){const j=SUMJ[s*4+m];if(OWN[j]!==me){OWN[j]=me;FLIP[FTOP++]=j;}}}
  for(let k=0;k<tc;k++)SUMC[TOUCH[k]]=0;
  if(COMBO&&FTOP>sp){
    let qh=0,qt=0; for(let k=sp;k<FTOP;k++)CQ[qt++]=FLIP[k];
    while(qh<qt){
      const p=CQ[qh++],n2=NB[p];
      for(let k=0;k<n2.length;k++){
        const d=n2[k][0],j=n2[k][1];
        if(OCC[j]<0||OWN[j]===me)continue;
        if(beatsF(ev(p,d),ev(j,OPPS[d]))){OWN[j]=me;FLIP[FTOP++]=j;if(qt<16)CQ[qt++]=j;}
      }
    }
  }
  for(let k=0;k<nb.length;k++){
    const d=nb[k][0],j=nb[k][1];
    if(OCC[j]<0||OWN[j]===me)continue;
    if(beatsF(ev(pos,d),ev(j,OPPS[d]))){OWN[j]=me;FLIP[FTOP++]=j;}
  }
}
function makeF(pos,ci,p){OCC[pos]=ci;OWN[pos]=p;const t=CTY[ci];if(t)TC[t]++;resolveF(pos,p);}
function unmakeF(pos,ci,p,st){while(FTOP>st)OWN[FLIP[--FTOP]]=1-p;const t=CTY[ci];if(t)TC[t]--;OCC[pos]=-1;}
function diffF(){let d=pc(HM[0])-pc(HM[1]);for(let i=0;i<9;i++)if(OCC[i]>=0)d+=OWN[i]===0?1:-1;return d;}
function heurF(){
  let v=diffF()*1000;
  for(let i=0;i<9;i++){
    if(OCC[i]<0)continue; const nb=NB[i]; let e=0,o=0;
    for(let k=0;k<nb.length;k++)if(OCC[nb[k][1]]<0){e+=ev(i,nb[k][0]);o++;}
    if(!o)continue; const q=(e/o-5)*6; v+= OWN[i]===0? q : -q;
  }
  return v;
}
function handIdxs(turn){
  const hm=HM[turn],hand=HAND[turn],out=[];
  for(let i=0;i<5;i++){
    if(!(hm&(1<<i)))continue;
    if(ORDER){out.push(i);break;}
    let dup=false; for(let k=0;k<out.length;k++)if(CSIG[hand[i]]===CSIG[hand[out[k]]]){dup=true;break;}
    if(!dup)out.push(i);
  }
  return out;
}
function abF(depth,alpha,beta,turn,filled){
  if(filled===9)return finalF();
  if(depth<=0)return heurF();
  if(NODES>NODECAP){TIMEDOUT=true;return heurF();}
  if(((NODES++)&255)===0&&Date.now()>TSTOP){TIMEDOUT=true;return heurF();}
  const hand=HAND[turn],cis=handIdxs(turn);
  if(!cis.length)return heurF();
  let mv=[];
  for(let a2=0;a2<cis.length;a2++)for(let p=0;p<9;p++)if(OCC[p]<0)mv.push(cis[a2]*16+p);
  if(depth>=3&&mv.length>2){
    const sc=[];
    for(let k=0;k<mv.length;k++){
      const i=mv[k]>>4,p=mv[k]&15,ci=hand[i],st=FTOP;
      makeF(p,ci,turn); sc[k]=diffF(); unmakeF(p,ci,turn,st);
    }
    const ord=mv.map((_,k)=>k);
    ord.sort((x,y)=>turn===0?sc[y]-sc[x]:sc[x]-sc[y]);
    mv=ord.map(k=>mv[k]);
  }
  let best= turn===0? -1e12 : 1e12;
  for(let k=0;k<mv.length;k++){
    const i=mv[k]>>4,p=mv[k]&15,ci=hand[i],st=FTOP;
    makeF(p,ci,turn); HM[turn]&=~(1<<i);
    const v=abF(depth-1,alpha,beta,1-turn,filled+1);
    HM[turn]|=(1<<i); unmakeF(p,ci,turn,st);
    if(turn===0){ if(v>best)best=v; if(best>alpha)alpha=best; }
    else { if(v<best)best=v; if(best<beta)beta=best; }
    if(alpha>=beta)break;
  }
  return best;
}
function simInit(s){
  const list=[],map=new Map();
  const push=c=>{ if(map.has(c))return map.get(c); const i=list.length; list.push(c); map.set(c,i); return i; };
  OCC=new Int8Array(9).fill(-1); OWN=new Int8Array(9); TC=new Int8Array(5);
  const cells=[];
  for(let i=0;i<9;i++){ if(!s.b[i]){cells.push(-1);continue;} cells.push(push(s.b[i].c)); }
  HAND=[new Int32Array(5),new Int32Array(5)]; HM=[0,0];
  for(let p=0;p<2;p++) s.h[p].forEach((c,i)=>{HAND[p][i]=push(c);HM[p]|=1<<i;});
  CV=new Int8Array(list.length*4); CTY=new Int8Array(list.length); CSIG=new Int32Array(list.length);
  const sig=new Map();
  list.forEach((c,i)=>{ for(let d=0;d<4;d++)CV[i*4+d]=c.v[d]; CTY[i]=c.t||0;
    const k=c.v.join()+'/'+(c.t||0); if(!sig.has(k))sig.set(k,sig.size); CSIG[i]=sig.get(k); });
  for(let i=0;i<9;i++){ if(cells[i]<0)continue; OCC[i]=cells[i]; OWN[i]=s.b[i].o; const t=CTY[cells[i]]; if(t)TC[t]++; }
  const R=s.R;
  SAME=!!R['同數'];PLUS=!!R['加算'];SWALL=!!R['同數壁'];COMBO=R['連鎖']!==false;
  REV=!!R['逆轉'];FACE=!!R['王牌殺手'];ASC=!!R['同類強化'];DSC=!!R['同類弱化'];ORDER=!!R['秩序'];
  FTOP=0;
}
/* 未知手牌補齊 */
function fillUnknown(s,pool,ghost,seed){
  const n=cloneS(s);
  const used=new Set();
  for(const x of n.b) if(x&&x.c.id) used.add(x.c.id);
  for(const c of n.h[0]) if(c.id) used.add(c.id);
  for(const c of n.h[1]) if(c.id) used.add(c.id);
  let avail=pool.filter(c=>!used.has(c.id));
  if(seed>0){ for(let i=avail.length-1;i>0;i--){const j=Math.floor(rnd(seed*97+i)*(i+1));[avail[i],avail[j]]=[avail[j],avail[i]];} }
  else avail=avail.slice().sort((a,b)=>sum(b.v)-sum(a.v));
  n.h[1]=n.h[1].map(c=>{
    if(!c.unknown)return c;
    return avail.length? avail.shift() : ghost;
  });
  return n;
}
function sum(v){return v[0]+v[1]+v[2]+v[3];}
function rnd(x){const t=Math.sin(x)*10000;return t-Math.floor(t);}

/* 單一最佳手（任一方） */
function bestMove(state,depth,budget){
  NODES=0;TIMEDOUT=false;TSTOP=Date.now()+(budget||400);
  simInit(state);
  const t=state.turn,cis=handIdxs(t);let best=null;
  for(const i of cis)for(let p=0;p<9;p++){
    if(OCC[p]>=0)continue;
    const ci=HAND[t][i],st=FTOP;
    makeF(p,ci,t);HM[t]&=~(1<<i);
    const v=abF(depth-1,-1e12,1e12,1-t,state.filled+1);
    HM[t]|=(1<<i);unmakeF(p,ci,t,st);
    if(!best||(t===0? v>best.v : v<best.v))best={i,p,v};
  }
  return best;
}
/* 回傳建議清單 */
function recommend(state,pool,ghost,depth,samples,onlyHi,budget){
  NODES=0; TIMEDOUT=false; TSTOP=Date.now()+(budget||2600);
  const S=Math.max(1,samples), acc=new Map();
  for(let k=0;k<S;k++){
    const s=fillUnknown(state,pool,ghost,k);
    simInit(s);
    const cis= onlyHi!=null? [onlyHi] : handIdxs(0);
    for(const i of cis){
      for(let p=0;p<9;p++){
        if(OCC[p]>=0)continue;
        const ci=HAND[0][i],st=FTOP;
        makeF(p,ci,0); HM[0]&=~(1<<i);
        const v=abF(depth-1,-1e12,1e12,1,state.filled+1);
        HM[0]|=(1<<i); unmakeF(p,ci,0,st);
        const key=i+':'+p; acc.set(key,(acc.get(key)||0)+v/S);
      }
    }
  }
  const list=[...acc.entries()].map(([k,v])=>{const [hi,pos]=k.split(':').map(Number);
    return {hi,pos,v,card:state.h[0][hi]};});
  list.sort((a,b)=>b.v-a.v);
  return list;
}

  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k); if(r) return JSON.parse(r.value);} }catch(e){}
    try{ const v=localStorage.getItem(k); if(v) return JSON.parse(v); }catch(e){}
    return MEM[k]!==undefined?MEM[k]:null;
  },
  async set(k,v){ MEM[k]=v;
    try{ if(window.storage){await window.storage.set(k,JSON.stringify(v)); return;} }catch(e){}
    try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
  }
};

/* 依 NPC 卡池，實戰模擬各排組的勝率 */
function shuffled(arr,seed){const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd(seed*131+i*7+1)*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const tick=()=>new Promise(r=>setTimeout(r,0));
async function rankDecks(){
  const cur=allNPC().find(n=>n.key===PLAY.key); if(!cur){toast('請先選 NPC');return;}
  const ready=DECKS.map((d,i)=>({d,i})).filter(x=>x.d&&x.d.cards.filter(Boolean).length===5);
  if(!ready.length){toast('還沒有完整的排組');return;}
  const pool=npcPool(cur);
  const R={'連鎖':true}; cur.rules.forEach(r=>{if(CALC_RULES.includes(r))R[r]=true;});
  const ex=$('#extra'); if(ex)ex.querySelectorAll('input:checked').forEach(i=>R[i.value]=true);
  WINB = PLAY.goal==='win';
  const S = pool.length<=5?2:4;
  const total=ready.length*2*S; let done=0;
  const out=[];
  PLAY.rank=null;
  for(const x of ready){
    let win=0,draw=0,lose=0,acc=0,n=0;
    for(let first=0;first<2;first++)for(let k=0;k<S;k++){
      const oh=shuffled(pool,k+first*17).slice(0,5);
      while(oh.length<5)oh.push(Object.assign({},{unknown:true,n:'未知',v:[7,7,7,7],t:0}));
      let st={b:Array(9).fill(null),h:[x.d.cards.slice(),oh],turn:first,filled:0,R};
      while(st.filled<9){const bm=bestMove(st,5,700); if(!bm)break; st=play(st,bm.i,bm.p);}
      const df=diffOf(st); n++; acc+=df; df>0?win++:df<0?lose++:draw++;
      done++; PLAY.busy='模擬中… '+done+' / '+total;
      const el=$('#p-play').querySelector('#rankBtn'); if(el&&el.nextElementSibling)el.nextElementSibling.textContent=PLAY.busy;
      await tick();
    }
    out.push({i:x.i,name:x.d.name,win,draw,lose,n,avg:acc/n});
  }
  out.sort((a,b)=>(b.win/b.n-a.win/a.n)||(b.avg-a.avg));
  PLAY.rank=out; PLAY.busy=''; PLAY.deck=out[0].i; renderPlay();
  toast('建議使用：'+out[0].name);
}

/* 秩序規則：把五張牌重排成最佳出牌順序 */
function permute5(){
  const out=[];
  const rec=(cur,rest)=>{ if(!rest.length){out.push(cur.slice());return;}
    for(let i=0;i<rest.length;i++){cur.push(rest[i]);rec(cur,rest.filter((_,j)=>j!==i));cur.pop();} };
  rec([],[0,1,2,3,4]); return out;
}
function battleRules(force){
  const R=Object.assign({},force||{});R['連鎖']=true;
  if(PLAY.mode==='npc'){
    const cur=allNPC().find(n=>n.key===PLAY.key);
    if(cur)cur.rules.forEach(r=>R[r]=true);
    const ex=$('#extra'); if(ex)ex.querySelectorAll('input:checked').forEach(i=>R[i.value]=true);
  }else{
    Object.assign(R,PLAY.freeRules);R['連鎖']=PLAY.freeRules['連鎖']!==false;
  }
  return R;
}
async function orderOptimize(){
  const manual = PLAY.mode==='free' && PLAY.mySrc==='manual';
  const src = manual? PLAY.freeMy : (DECKS[PLAY.deck]&&DECKS[PLAY.deck].cards);
  if(!src||src.filter(Boolean).length!==5){toast('請先備好五張牌');return;}
  const cards=src.slice();
  const R=battleRules({'秩序':true}); R['秩序']=true;
  let pool=[],g;
  if(PLAY.mode==='npc'){const cur=allNPC().find(n=>n.key===PLAY.key); pool=cur?npcPool(cur):[]; g={unknown:true,n:'未知',v:[7,7,7,7],t:0};}
  else {pool=PLAY.freeOpp.filter(Boolean); const x=PLAY.ghost; g={unknown:true,n:'未知',v:[x,x,x,x],t:0};}
  WINB = PLAY.goal==='win';
  const S = pool.length>5?2:1;
  const btn=$('#ordBtn'); if(btn)btn.disabled=true;
  const say=t=>{PLAY.ordMsg=t;const b=$('#ordBtn');if(b&&b.nextElementSibling)b.nextElementSibling.textContent=t;};
  const hands=[];
  for(let first=0;first<2;first++)for(let k=0;k<S;k++){
    const oh=(pool.length?shuffled(pool,k+first*13):[]).slice(0,5);
    while(oh.length<5)oh.push(Object.assign({},g));
    hands.push({first,oh});
  }
  const score=async(list,depth,label)=>{
    const out=[];let i=0;
    for(const p of list){
      const my=p.map(x=>cards[x]);let acc=0;
      for(const h of hands){
        let v=0;
        try{const bm=bestMove({b:Array(9).fill(null),h:[my.slice(),h.oh],turn:h.first,filled:0,R},depth,400);v=bm?bm.v:0;}catch(e){}
        acc+=v;
      }
      out.push({perm:p,my,avg:acc/hands.length});
      if(++i%15===0){say(label+' '+Math.round(i/list.length*100)+'%');await tick();}
    }
    out.sort((a,b)=>b.avg-a.avg);return out;
  };
  const rough=await score(permute5(),5,'初步篩選…');
  const fine=await score(rough.slice(0,16).map(r=>r.perm),9,'精算前 16 種…');
  const best=fine[0];
  if(btn)btn.disabled=false;
  if(!best){say('計算失敗，請再試一次');return;}
  if(manual)PLAY.freeMy=best.my;
  else {DECKS[PLAY.deck].cards=best.my; await saveDecks(); renderDecks();}
  const e=est(best.avg);
  PLAY.ordMsg='已重排：'+best.my.map(c=>c.n||'自訂').join(' → ')+'（預估 '+e.my+'：'+e.op+'）';
  renderPlay(); toast('已依秩序規則重排順序');
}

/* ===================== 對戰盤 ===================== */
let B=null;
function startBattle(cfg){
  const g=cfg.ghost, hand=[];
  if(cfg.pool.length&&cfg.pool.length<=5) hand.push(...cfg.pool);
  else hand.push(...(cfg.oppKnown||[]));
  while(hand.length<5) hand.push(Object.assign({},g));
  B={cfg,auto:PLAY.auto,sel:null,selSide:0,adv:[],last:null,noAuto:false,hist:[],gen:0,thinking:false,forced:null,editMine:false,
     s:{b:Array(9).fill(null),h:[cfg.myCards.slice(),hand.slice(0,5)],turn:cfg.first,filled:0,R:cfg.R}};
  showTab('battle');
  if(B.s.turn===0) step(); else renderBattle();
}
function scoreNow(){let m=B.s.h[0].length,o=B.s.h[1].length;for(const x of B.s.b)if(x)x.o===0?m++:o++;return[m,o];}
function poolLeft(){
  if(!B.cfg.pool.length)return [];
  const used=new Set(); for(const x of B.s.b) if(x&&x.c.id) used.add(x.c.id);
  return B.cfg.pool.filter(c=>!used.has(c.id));
}
/* 推算用的取樣池：NPC 用他的卡池；自訂對戰用「對手牌力」對應的真實卡片 */
function simPool(){
  const p=poolLeft(); if(p.length)return p;
  const gp=B.cfg.guessPool; if(!gp||!gp.length)return [];
  const used=new Set();
  for(const x of B.s.b) if(x&&x.c.id) used.add(x.c.id);
  for(const c of B.s.h[0]) if(c&&c.id) used.add(c.id);
  for(const c of B.s.h[1]) if(c&&!c.unknown&&c.id) used.add(c.id);
  return gp.filter(c=>!used.has(c.id));
}
/* 保底：一步貪心，永遠算得出來 */
function fallbackList(onlyHi){
  const s=B.s,out=[];
  for(let i=0;i<s.h[0].length;i++){
    if(onlyHi!=null&&i!==onlyHi)continue;
    for(let p=0;p<9;p++){
      if(s.b[p])continue;
      try{ out.push({hi:i,pos:p,v:diffOf(play(s,i,p))*1000,card:s.h[0][i]}); }catch(e){}
    }
  }
  out.sort((a,b)=>b.v-a.v);
  return out;
}
function think(onlyHi){
  if(!B)return [];
  const rem=9-B.s.filled; if(rem<=0)return [];
  let list=null;
  try{
    WINB = B.cfg.goal!=='cards';
    const budget = rem>=8?800 : rem===7?1100 : 2000;
    const t0=Date.now(),pool=simPool();
    const unknown=B.s.h[1].filter(c=>c.unknown).length;
    const samples = (!unknown||pool.length<=B.s.h[1].length) ? 1
                  : pool.length<=10 ? (rem>=8?2:3) : (rem>=8?4:6);
    for(let d=3;d<=rem;d++){
      const left=budget-(Date.now()-t0);
      if(list&&left<60)break;
      let r=null;
      try{ r=recommend(B.s,pool,B.cfg.ghost,d,samples,onlyHi,Math.max(120,left)); }
      catch(err){ console.error('search',err); break; }
      if(r&&r.length&&(!TIMEDOUT||!list))list=r;
      if(TIMEDOUT)break;
    }
  }catch(err){ console.error('think',err); }
  if(!list||!list.length) list=fallbackList(onlyHi);
  return list||[];
}
function est(v0){let v=v0; if(WINB){ if(v>1250)v-=2500; else if(v<-1250)v+=2500; }
  const diff=v/1000,my=Math.max(0,Math.min(10,Math.round((10+diff)/2)));return{my,op:10-my,txt:diff>0.2?'勝':diff<-0.2?'負':'和'};}
/* 我方回合：自動落子或給建議 */
function step(){
  if(!B)return;
  if(B.s.turn!==0||B.s.filled===9){B.thinking=false;renderBattle();return;}
  if(B.s.R['混亂']&&B.forced===null){B.thinking=false;B.adv=[];renderBattle();return;}
  B.adv=[];B.thinking=true;renderBattle();
  const gen=++B.gen;
  setTimeout(()=>{
    if(!B||B.gen!==gen)return;
    const fi=B.forced;
    let list=[];
    try{ list=think(fi)||[]; }catch(e){ console.error(e); }
    if(!list.length){ try{ list=fallbackList(fi); }catch(e){ list=[]; } }
    B.thinking=false;
    B.adv=list.slice(0,5);
    try{
      if(B.auto&&!B.noAuto&&list.length){
        const best=list[0];
        B.hist.push(cloneS(B.s));
        B.last={pos:best.pos,card:B.s.h[0][best.hi],e:est(best.v),auto:true};
        B.s=play(B.s,best.hi,best.pos);
        B.adv=[];
      }
    }catch(e){ console.error('auto move',e); toast('自動落子失敗，請手動選擇'); B.auto=false; }
    B.noAuto=false;renderBattle();
  },20);
}
function myPlay(hi,pos){
  if(!B||!B.s.h[0][hi]||B.s.b[pos])return;
  B.hist.push(cloneS(B.s));
  const c=B.s.h[0][hi];
  B.last={pos,card:c,e:null,auto:false};
  B.s=play(B.s,hi,pos);B.sel=null;B.adv=[];B.forced=null;renderBattle();
}
function oppPlay(card,pos){
  if(!B||B.s.filled>=9||!B.s.h[1].length||B.s.b[pos])return;
  let i=B.s.h[1].findIndex(c=>!c.unknown&&sameCard(c,card));
  if(i<0)i=B.s.h[1].findIndex(c=>c.unknown);
  if(i<0)i=0;
  B.hist.push(cloneS(B.s));
  B.s.h[1]=B.s.h[1].slice();B.s.h[1][i]=card;
  B.last={pos,card,e:null,auto:false};
  B.s=play(B.s,i,pos);B.sel=null;
  step();
}

  else if(B.last&&B.last.auto&&!over&&s.turn===1)

  };
  $('#p-decks').onchange=async e=>{if(!e.target.classList.contains('dn'))return;
    const i=+e.target.dataset.d;DECKS[i]=DECKS[i]||{name:'',cards:[null,null,null,null,null]};
    DECKS[i].name=e.target.value||('排組 '+(i+1));await saveDecks();};
}

/* ===================== 自訂 NPC ===================== */
let NE=null;
function newNE(){return{id:Date.now(),n:'',loc:'',area:'自訂',ver:'自訂',rules:[],rw:[],pool:[],custom:true};}
function renderNPCs(){
  $('#p-npcs').innerHTML=`
  <div class="blk"><h3>自訂 NPC</h3>
    <p class="hint" style="margin-top:0">內建 ${NPCS.length} 名 NPC。這裡可以自己新增沒收錄的對手：填名稱、規則，再把他的卡一張張加進卡池（可直接手填數值）。</p>
    <div class="row" style="margin-top:8px"><button class="btn" id="neNew">＋ 新增 NPC</button></div>
    ${MYNPC.length?`<div class="nplist" style="margin-top:10px">${MYNPC.map(n=>`<div class="nprow">
      <div><div class="l1">${esc(n.n||'（未命名）')}</div><div class="l2">${esc(n.area||'')} · 卡池 ${n.pool.length} 張</div></div>
      <div class="rt">${n.rules.map(r=>`<span class="tag g">${r}</span>`).join('')}
        <button class="btn sm" data-ed="${n.id}">編輯</button><button class="btn sm" data-del="${n.id}">刪除</button></div></div>`).join('')}</div>`:''}
  </div>
  ${NE?`<div class="blk"><h3>${NE.pool.length||NE.n?'編輯':'新增'} NPC</h3>
    <div class="row"><label class="fld grow">名稱<input type="text" id="neN" value="${esc(NE.n)}" placeholder="例：某某 NPC"></label>
      <label class="fld grow">地點／地區<input type="text" id="neA" value="${esc(NE.area)}" placeholder="例：黑衣森林"></label></div>
    <div class="dim" style="font-size:12px;margin:10px 0 4px">規則</div>
    <div class="rules" id="neR">${RULE_DEFS.map(([r,d])=>`<label class="${NE.rules.includes(r)?'on':''}"><input type="checkbox" value="${r}" ${NE.rules.includes(r)?'checked':''}><span>${r}<small>${d}</small></span></label>`).join('')}</div>
    <div class="dim" style="font-size:12px;margin:12px 0 4px">卡池（放幾張都行；剛好 5 張＝完整手牌）</div>
    <div class="rail" id="neP">${NE.pool.map((c,i)=>cardHTML(c,'opp s tap',`data-pc="${i}"`)).join('')}${NE.pool.length<10?cardHTML(null,'s tap','data-padd="1"'):''}</div>
    <div class="row" style="margin-top:12px"><button class="btn go" id="neSave">儲存</button><button class="btn" id="neX">取消</button></div>
  </div>`:''}`;
  $('#neNew').onclick=()=>{NE=newNE();renderNPCs();};
  $('#p-npcs').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{NE=JSON.parse(JSON.stringify(MYNPC.find(n=>n.id==b.dataset.ed)));renderNPCs();});
  $('#p-npcs').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('刪除這個 NPC？'))return;
    MYNPC=MYNPC.filter(n=>n.id!=b.dataset.del);await saveNPC();renderNPCs();renderPlay();});
  if(!NE)return;
  $('#neR').onchange=e=>{const r=e.target.value;
    NE.rules=e.target.checked?[...new Set([...NE.rules,r])]:NE.rules.filter(x=>x!==r);
    e.target.closest('label').classList.toggle('on',e.target.checked);};
  $('#neP').onclick=e=>{
    const a=e.target.closest('[data-padd]');
    if(a){openPicker('加入卡池',c=>{if(!c)return;NE.n=$('#neN').value;NE.area=$('#neA').value;NE.pool.push(c);renderNPCs();},{saveToLib:true});return;}
    const p=e.target.closest('[data-pc]');
    if(p){NE.n=$('#neN').value;NE.area=$('#neA').value;NE.pool.splice(+p.dataset.pc,1);renderNPCs();}
  };
  $('#neX').onclick=()=>{NE=null;renderNPCs();};
  $('#neSave').onclick=async()=>{
    NE.n=$('#neN').value.trim()||'自訂 NPC';NE.area=$('#neA').value.trim()||'自訂';NE.loc=NE.area;NE.ver='自訂';
    if(!NE.pool.length){toast('卡池至少放一張');return;}
    const i=MYNPC.findIndex(n=>n.id===NE.id);
    if(i>=0)MYNPC[i]=NE;else MYNPC.push(NE);
    await saveNPC();NE=null;renderNPCs();renderPlay();toast('已儲存');
  };
}

/* ===================== 卡牌庫 / 說明 ===================== */
function renderLib(){
  $('#p-lib').innerHTML=`<div class="blk"><h3>卡牌庫</h3>
    <div class="row"><input type="text" id="lq" class="grow" placeholder="搜尋卡名／編號"><button class="btn" id="lAdd">＋ 新增自訂卡</button></div>
    <p class="hint">內建 ${BASE_CARDS.length} 張。自訂卡點一下可刪除。</p>
    <div class="pickgrid" id="lg" style="max-height:62vh;margin-top:10px"></div></div>`;
  const draw=()=>{const q=$('#lq').value.trim();
    $('#lg').innerHTML=DB.filter(c=>!q||c.n.includes(q)||String(c.id).includes(q))
      .map(c=>cardHTML(c,'s'+(c.src==='custom'?' tap':''),c.src==='custom'?`data-del="${c.id}"`:'')).join('');};
  draw();$('#lq').oninput=draw;
  $('#lAdd').onclick=()=>openPicker('新增自訂卡',async c=>{if(!c)return;c.id=Math.max(900,...DB.map(x=>x.id||0))+1;c.src='custom';DB.push(c);await saveCustom();renderLib();toast('已新增');});
  $('#lg').onclick=async e=>{const d=e.target.closest('[data-del]');if(!d)return;
    if(confirm('刪除這張自訂卡？')){DB=DB.filter(c=>c.id!==+d.dataset.del);await saveCustom();renderLib();}};
}
function renderHelp(){
  $('#p-help').innerHTML=`
  <div class="blk"><h3>最快的用法</h3>
   <ol style="padding-left:18px;line-height:1.95">
     <li>「排組」建好一組五張。</li>
     <li>「對戰」選 NPC（或自訂對手）→ 選先手 → 開始。</li>
     <li>我先手時會<b>自動幫你落子</b>；換對手時，點他打出的那張牌，再點他放的格子，接著我會立刻算完並自動放上我方最佳的一張。</li>
     <li>想自己決定就關掉「自動落子」，改點建議清單（點一下就下）。先手／後手也能在對戰畫面直接切換重開。</li>
   </ol>
   <p class="hint">所有數值都用點的：填卡片時直接點 1～A 的按鈕，不用打字。</p></div>
  <div class="blk"><h3>兩個好用的開關</h3>
   <p class="hint" style="margin-top:0"><b>試算哪組排組贏面最大</b>：選好 NPC 後按一下，會用你已存的每組排組跟他實戰模擬（先手／後手各跑幾局），列出勝率與平均卡差並自動選中最好的一組。</p>
   <p class="hint"><b>對手牌力</b>（自訂對戰）：對手沒公開的牌，不再當成一張平庸的 7／7／7／7，而是從你指定等級的<b>真實卡片</b>裡反覆抽樣後取平均，等於把「他可能有 A、可能有 9」算進去。實測在同樣的計算時間下，平均卡差從 +0.8 提升到 +1.5，敗場也明顯減少。選錯等級也還是比舊做法好，抓不準就選「高階 ★3–5」。</p>
   <p class="hint"><b>目標</b>：「求勝」會優先確保贏（NPC 預設）；「搶最多卡」不管輸贏、一律把翻到的卡數差最大化，適合幻卡大賽計分（自訂對戰預設）。</p></div>
  <div class="blk"><h3>推算方式</h3>
   <p class="hint" style="margin-top:0">alpha-beta 完全搜尋，會把<b>對手手上還沒出的牌</b>一起算進去：NPC 卡池剛好 5 張時等於完全已知；超過 5 張時會從剩餘候選取樣多次平均。時間不夠時採漸進加深，先給出淺層答案再自動加深，通常 1～2 秒內完成，接近終局會直接算到底。</p>
   <p class="hint">支援：同數、加算、同數壁、連鎖、逆轉、王牌殺手、同類強化／弱化、秩序。不勝不休／交換／天選／隨機不影響單局推算，實際抽到的規則請自行勾選。</p></div>
  <div class="blk"><h3>資料</h3>
   <ul style="padding-left:18px" class="hint">
     <li>卡片與 NPC 卡池整理自灰機 wiki「九宮幻卡獲取方式」，內建 ${NPCS.length} 名 NPC、${BASE_CARDS.length} 張卡。</li>
     <li>網頁不能跨網域即時抓 wiki（CORS），所以資料是預先內建的；沒收錄的對手請用「NPC」分頁自行新增，卡片可直接手填數值。</li>
     <li>數值順序一律 上／下／左／右，10 顯示成 A。資料存在這台裝置的瀏覽器裡。</li>
   </ul></div>`;
}

/* ===================== 啟動 ===================== */
function showTab(t){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  $('#p-'+t).classList.add('on');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  try{window.scrollTo(0,0);}catch(e){}
}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  const t=b.dataset.t;
  if(t==='play')renderPlay(); if(t==='decks')renderDecks(); if(t==='npcs')renderNPCs(); if(t==='lib')renderLib();
  showTab(t);};
(async function boot(){
  const cc=await Store.get('tt_custom_cards'); if(Array.isArray(cc)&&cc.length)DB=BASE_CARDS.concat(cc);
  const dk=await Store.get('tt_decks'); if(Array.isArray(dk)&&dk.length===4)DECKS=dk;
  const np=await Store.get('tt_npcs'); if(Array.isArray(np))MYNPC=np;
  renderPlay();renderDecks();renderNPCs();renderLib();renderHelp();
})();

</script>
</body>
</html>
